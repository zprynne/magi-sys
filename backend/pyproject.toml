[project]
name = "magi"
version = "0.1.0"
description = "MAGI: a three-agent deliberation system with a live visual console"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "json-repair>=0.63.5",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
magi-schema = "magi.schema_export:main"
magi-server = "magi.server:main"
magi-mlx = "magi.mlx_launcher:main"
magi-resources = "magi.resources:main"

[project.optional-dependencies]
mlx = [
    "mlx-lm>=0.32.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "scripts", "../tasks.py"]

[[tool.mypy.overrides]]
# MLX only installs on Apple Silicon; elsewhere it is simply absent.
module = ["mlx", "mlx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
