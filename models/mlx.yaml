# All-local council on Apple Silicon, served by mlx-lm.
#
#   make mlx      # terminal 1: starts one mlx_lm.server per model below
#   make local    # terminal 2: MAGI API using this profile (no API key needed)
#   make frontend # terminal 3
#
# Three different model families argue better than one model playing three
# parts. Measured on a 24 GB M4: ~12 GB for all three servers. To save memory,
# point several agents at the same base_url (one server, one copy of the
# weights); to swap a model, change `name` (any mlx-community chat model).
defaults:
  provider: openai              # OpenAI-compatible API (mlx_lm.server)
  max_tokens: 1024
  temperature: 0.7
  extra_body:
    # Qwen3 models think out loud by default; MAGI only needs the answer.
    chat_template_kwargs: {enable_thinking: false}

agents:
  melchior:
    name: mlx-community/Qwen3.5-9B-MLX-4bit
    base_url: http://127.0.0.1:8091/v1
  balthasar:
    name: mlx-community/Qwen3-8B-4bit
    base_url: http://127.0.0.1:8092/v1
  caspar:
    name: mlx-community/Llama-3.2-3B-Instruct-4bit
    base_url: http://127.0.0.1:8093/v1

# Shares MELCHIOR's server, so it costs no extra memory.
arbiter:
  name: mlx-community/Qwen3.5-9B-MLX-4bit
  base_url: http://127.0.0.1:8091/v1
  temperature: 0.2
